name: CI

on:
  push:
    branches:
      - master

  pull_request:

env:
  POSTGRES_DB: mission_management_ci
  POSTGRES_USER: user
  POSTGRES_PASSWORD: test

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw -B verify
